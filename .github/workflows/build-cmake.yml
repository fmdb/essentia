name: Build with CMake

on:
  workflow_dispatch:

env:
  # CMake build type (Debug, Release, RelWithDebInfo or MinSizeRel)
  BUILD_TYPE: Debug
  BUILD_EXAMPLES: "standard_tempocnn;streaming_extractor_music;streaming_musicnn_predict;streaming_tensorflowpredict;streaming_vggish_predict;standard_chromaprinter"

jobs:
  ubuntu:
    name: Ubuntu (build and test)
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: 'true'

      # Handle Tensorflow installation
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y libeigen3-dev libyaml-dev libfftw3-dev libavcodec-dev libavformat-dev libavutil-dev libswresample-dev libsamplerate0-dev libtag1-dev libchromaprint-dev

      - name: Setup TensorFlow C++ libraries
        run: |
          # Download and install TensorFlow C API for Linux
          wget https://storage.googleapis.com/tensorflow/versions/2.18.0/libtensorflow-cpu-linux-x86_64.tar.gz
          sudo tar -C /usr/local -xzf libtensorflow-cpu-linux-x86_64.tar.gz
          rm libtensorflow-cpu-linux-x86_64.tar.gz
          # Copy the C headers that Essentia expects
          sudo mkdir -p /usr/local/include/tensorflow/c
          sudo cp -r src/3rdparty/tensorflow/c/* /usr/local/include/tensorflow/c/
          # Update library cache
          sudo ldconfig

      - name: Configure
        run: cmake -B build -DUSE_TENSORFLOW=ON -DBUILD_EXAMPLES="${{env.BUILD_EXAMPLES}}" -DENABLE_STATIC_DEPENDENCIES=ON -DBUILD_TESTS=ON

      - name: Build
        run: cmake --build build --config ${{env.BUILD_TYPE}}

      - name: Test
        run: ctest --test-dir build --output-on-failure -C ${{env.BUILD_TYPE}}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: essentia-ubuntu-${{env.BUILD_TYPE}}
          path: |
            build/*

  macos:
    name: MacOS (build and test)
    runs-on: macos-14

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: 'true'

      - name: Install dependencies
        run: brew install eigen fftw ffmpeg libsamplerate libtag chromaprint

      - name: Setup TensorFlow C++ libraries
        run: |
          # Download and install TensorFlow C API for macOS
          if [[ $(uname -m) == "arm64" ]]; then
            # macOS ARM64 - use TensorFlow 2.18.0 (last available version)
            wget https://storage.googleapis.com/tensorflow/versions/2.18.0/libtensorflow-cpu-darwin-arm64.tar.gz
            sudo tar -C /usr/local -xzf libtensorflow-cpu-darwin-arm64.tar.gz
            rm libtensorflow-cpu-darwin-arm64.tar.gz
          else
            # macOS x86_64 - use TensorFlow 2.16.2 (last available version)
            wget https://storage.googleapis.com/tensorflow/versions/2.16.2/libtensorflow-cpu-darwin-x86_64.tar.gz
            sudo tar -C /usr/local -xzf libtensorflow-cpu-darwin-x86_64.tar.gz
            rm libtensorflow-cpu-darwin-x86_64.tar.gz
          fi
          # Copy the C headers that Essentia expects
          sudo mkdir -p /usr/local/include/tensorflow/c
          sudo cp -r src/3rdparty/tensorflow/c/* /usr/local/include/tensorflow/c/

      - name: Configure
        run: cmake -B build -DUSE_TENSORFLOW=ON -DBUILD_EXAMPLES="${{env.BUILD_EXAMPLES}}" -DENABLE_STATIC_DEPENDENCIES=ON -DBUILD_TESTS=ON

      - name: Build
        run: cmake --build build --config ${{env.BUILD_TYPE}}

      - name: Test
        run: ctest --test-dir build --output-on-failure -C ${{env.BUILD_TYPE}}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: essentia-macos-${{env.BUILD_TYPE}}
          path: |
            build/*

  windows:
    name: Windows (build and test)
    runs-on: windows-latest
    defaults:
      run:
        shell: cmd

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: 'true'

      - name: Install dependencies
        run: .\packaging\build-dependencies-msvc.bat --with-tensorflow

      - name: Configure
        run: cmake -B build -DUSE_TENSORFLOW=ON -DBUILD_EXAMPLES=${{env.BUILD_EXAMPLES}} -DENABLE_STATIC_DEPENDENCIES=ON -DBUILD_TESTS=ON -DCMAKE_PREFIX_PATH=%CD%\packaging\msvc

      - name: Build
        run: |
          set PATH=%PATH%;%CD%\packaging\msvc\bin
          cmake --build build --config ${{env.BUILD_TYPE}} --parallel

      - name: Test
        run: |
          set PATH=%PATH%;%CD%\packaging\msvc\bin
          ctest --test-dir build --output-on-failure -C ${{env.BUILD_TYPE}}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: essentia-windows-${{env.BUILD_TYPE}}
          path: |
            build/src/${{env.BUILD_TYPE}}/essentia*
            build/src/examples/${{env.BUILD_TYPE}}/*
            build/src/python/${{env.BUILD_TYPE}}/_essentia*
            packaging/msvc/bin/*.dll
